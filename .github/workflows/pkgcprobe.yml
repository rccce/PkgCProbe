name: PkgCProbe build
on:
  workflow_dispatch:
  push:
    paths:
      - 'PkgCProbe/**'
      - '.github/workflows/pkgcprobe.yml'
jobs:
  build:
    runs-on: macos-15
    env:
      SDK: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
    steps:
      - uses: actions/checkout@v4
      - name: MacKernelSDK
        run: |
          git clone -q https://github.com/acidanthera/MacKernelSDK.git MacKernelSDK
          git -C MacKernelSDK checkout -q "$SDK"
      - name: Build PkgCProbe.kext
        shell: bash
        run: |
          exec > >(tee -a build.log) 2>&1
          set -euo pipefail
          mkdir -p obj dist/PkgCProbe.kext/Contents/MacOS
          cat > obj/kmod_info.c <<'KMOD'
          #include <mach/mach_types.h>
          #include <mach/kmod.h>

          static kern_return_t pcp_start(kmod_info_t *ki, void *data) { (void)ki; (void)data; return KERN_SUCCESS; }
          static kern_return_t pcp_stop(kmod_info_t *ki, void *data) { (void)ki; (void)data; return KERN_SUCCESS; }

          __attribute__((visibility("default"))) KMOD_EXPLICIT_DECL(local.PkgCProbe, "1.0.0", pcp_start, pcp_stop)
          KMOD
          SYSROOT="$(xcrun --show-sdk-path)"
          FLAGS=(-target x86_64-apple-macos10.13 -isysroot "$SYSROOT" -I MacKernelSDK/Headers
                 -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT
                 -fno-builtin -fno-common -mkernel -fno-stack-protector -O2 -Wall)
          xcrun clang -x c -std=gnu11 "${FLAGS[@]}" -c obj/kmod_info.c -o obj/kmod_info.o
          xcrun clang++ -x c++ -std=gnu++17 "${FLAGS[@]}" -fapple-kext -fno-rtti -fno-exceptions \
            -c PkgCProbe/PkgCProbe.cpp -o obj/PkgCProbe.o
          BIN=dist/PkgCProbe.kext/Contents/MacOS/PkgCProbe
          xcrun clang++ -target x86_64-apple-macos10.13 -isysroot "$SYSROOT" -nostdlib -fapple-kext \
            -Xlinker -kext obj/PkgCProbe.o obj/kmod_info.o -lcc_kext -o "$BIN"
          cp PkgCProbe/Info.plist dist/PkgCProbe.kext/Contents/Info.plist
          plutil -lint dist/PkgCProbe.kext/Contents/Info.plist
          FT=$(file "$BIN"); echo "$FT"
          [[ "$FT" == *"kext bundle"* && "$FT" == *x86_64* ]] || { echo "not an x86_64 kext"; exit 1; }
          DEF=$(nm -gU "$BIN"); [[ "$DEF" == *" _kmod_info"* ]] || { echo "_kmod_info missing"; exit 1; }
          LC=$(otool -l "$BIN"); [[ "$LC" != *LC_DYLD_CHAINED_FIXUPS* ]] || { echo "chained fixups found"; exit 1; }
          echo "undefined symbols (all must come from the kernel or IOPCIFamily):"
          nm -u "$BIN"
          echo "build OK"
      - uses: actions/upload-artifact@v4
        with:
          name: PkgCProbe
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PkgCProbe-build-log
          path: build.log
